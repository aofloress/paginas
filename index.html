<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío: Clasificación de Datos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .progress-bar {
            background-color: var(--border);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 20px;
            color: #64748b;
        }

        .card-data {
            background: #f1f5f9;
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.05rem;
            color: #0f172a;
            white-space: pre-wrap;
            overflow-x: auto;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 600px) {
            .selectors-grid {
                grid-template-columns: 1fr;
            }
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .select-group label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #fff;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .feedback.correct {
            background-color: #dcfce7;
            color: #14532d;
            border: 1px solid #86efac;
        }

        .feedback.incorrect {
            background-color: #fee2e2;
            color: #7f1d1d;
            border: 1px solid #fca5a5;
        }

        .results {
            text-align: center;
            display: none;
        }

        .results h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .results p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="quiz-screen">
        <div class="header">
            <h1>Lab de Datos: Clasificación</h1>
            <p>Identifica la estructura y el tipo de variable para cada muestra.</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <div class="score-board">
            <span id="question-count">Tarjeta 1 de 6</span>
            <span id="score">Puntos: 0</span>
        </div>

        <div class="card-data" id="data-display">
            <!-- El dato se inserta dinámicamente -->
        </div>

        <div class="selectors-grid">
            <div class="select-group">
                <label for="select-structure">1. Estructura del Dato:</label>
                <select id="select-structure">
                    <option value="" disabled selected>Seleccionar...</option>
                    <option value="Estructurado">Estructurado</option>
                    <option value="Semi-estructurado">Semi-estructurado</option>
                    <option value="No estructurado">No estructurado</option>
                </select>
            </div>

            <div class="select-group">
                <label for="select-type">2. Tipo de Variable:</label>
                <select id="select-type">
                    <option value="" disabled selected>Seleccionar...</option>
                    <option value="Cualitativo Nominal">Cualitativo Nominal</option>
                    <option value="Cualitativo Ordinal">Cualitativo Ordinal</option>
                    <option value="Cuantitativo Discreto">Cuantitativo Discreto</option>
                    <option value="Cuantitativo Continuo">Cuantitativo Continuo</option>
                </select>
            </div>
        </div>

        <button class="btn" id="btn-submit" onclick="checkAnswer()">Validar Respuesta</button>
        <button class="btn" id="btn-next" onclick="nextQuestion()" style="display: none;">Siguiente Tarjeta</button>

        <div class="feedback" id="feedback"></div>
    </div>

    <div class="results" id="results-screen">
        <h2>¡Desafío Completado!</h2>
        <p id="final-score"></p>
        <button class="btn" onclick="restartGame()">Jugar de nuevo</button>
    </div>
</div>

<script>
    const questions = [
        {
            data: "ID_Estudiante: 1042\nNombre: Ana López\nEdad: 21",
            structure: "Estructurado",
            type: "Cuantitativo Discreto",
            explanation: "Es **Estructurado** porque sigue un formato rígido de tabla o registro, y la 'Edad' seleccionada es un valor **Cuantitativo Discreto** (número entero contable)."
        },
        {
            data: '{\n  "cliente": "Carlos",\n  "nivel_satisfaccion": "Alto",\n  "comentario": "Excelente servicio"\n}',
            structure: "Semi-estructurado",
            type: "Cualitativo Ordinal",
            explanation: "Es **Semi-estructurado** por usar formato JSON (con claves y valores sin tabla fija), y el 'nivel_satisfaccion' es **Cualitativo Ordinal** (tiene una jerarquía: Alto, Medio, Bajo)."
        },
        {
            data: '"¡Pésimo servicio! El pedido tardó casi dos horas en llegar y la comida estaba completamente fría."',
            structure: "No estructurado",
            type: "Cualitativo Nominal",
            explanation: "Es **No estructurado** (texto libre sin etiquetas ni columnas) y representa una opinión no jerarquizable directamente (**Cualitativo Nominal**)."
        },
        {
            data: "Registro médico: Estatura del paciente = 1.78 metros",
            structure: "Estructurado",
            type: "Cuantitativo Continuo",
            explanation: "Es **Estructurado** (campo formal en historia clínica) y la 'Estatura' es **Cuantitativo Continuo** porque se mide en una escala con infinitos valores decimales posibles."
        },
        {
            data: "Lugar obtenido en la competencia académica: 2° Puesto",
            structure: "Estructurado",
            type: "Cualitativo Ordinal",
            explanation: "Es **Estructurado** y el 'Puesto' es **Cualitativo Ordinal**, ya que denota un orden implícito (1°, 2°, 3°)."
        },
        {
            data: "Audio grabado (.mp3): Llamada telefónica a atención al cliente.",
            structure: "No estructurado",
            type: "Cualitativo Nominal",
            explanation: "Un archivo de audio es **No estructurado** (multimedia libre sin campos rígidos) y su contenido general clasifica como **Cualitativo Nominal**."
        }
    ];

    let currentIdx = 0;
    let score = 0;

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('data-display').innerText = q.data;
        document.getElementById('question-count').innerText = `Tarjeta ${currentIdx + 1} de ${questions.length}`;
        document.getElementById('progress').style.width = `${(currentIdx / questions.length) * 100}%`;
        
        // Reset inputs
        document.getElementById('select-structure').selectedIndex = 0;
        document.getElementById('select-type').selectedIndex = 0;
        document.getElementById('select-structure').disabled = false;
        document.getElementById('select-type').disabled = false;
        
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('btn-submit').style.display = 'block';
        document.getElementById('btn-next').style.display = 'none';
    }

    function checkAnswer() {
        const structAns = document.getElementById('select-structure').value;
        const typeAns = document.getElementById('select-type').value;

        if (!structAns || !typeAns) {
            alert("Por favor selecciona ambas opciones antes de validar.");
            return;
        }

        const q = questions[currentIdx];
        const feedbackEl = document.getElementById('feedback');
        
        const isCorrectStruct = structAns === q.structure;
        const isCorrectType = typeAns === q.type;

        document.getElementById('select-structure').disabled = true;
        document.getElementById('select-type').disabled = true;

        if (isCorrectStruct && isCorrectType) {
            score += 10;
            feedbackEl.className = "feedback correct";
            feedbackEl.innerHTML = `<strong>¡Correcto! (+10 pts)</strong><br>${q.explanation}`;
        } else {
            feedbackEl.className = "feedback incorrect";
            feedbackEl.innerHTML = `<strong>Incorrecto.</strong><br>La respuesta correcta era: <b>${q.structure}</b> y <b>${q.type}</b>.<br><br>${q.explanation}`;
        }

        document.getElementById('score').innerText = `Puntos: ${score}`;
        feedbackEl.style.display = 'block';
        document.getElementById('btn-submit').style.display = 'none';
        document.getElementById('btn-next').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';
        const maxScore = questions.length * 10;
        document.getElementById('final-score').innerText = `Obtuviste ${score} de ${maxScore} puntos posibles.`;
    }

    function restartGame() {
        currentIdx = 0;
        score = 0;
        document.getElementById('score').innerText = `Puntos: 0`;
        document.getElementById('results-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        loadQuestion();
    }

    // Inicializar primera tarjeta
    loadQuestion();
</script>

</body>
</html>
